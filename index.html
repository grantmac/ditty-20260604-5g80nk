<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superhands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <section class="hero" data-node-id="2:2" aria-label="Superhands hero">
      <div class="hero__panel" data-node-id="2:3" aria-hidden="true"></div>
      <p class="hero__headline hero__headline--primary" data-node-id="2:5">
        Designers and Engineers,
      </p>
      <p class="hero__headline hero__headline--secondary" data-node-id="2:7">
        finally on the same cadence.
      </p>
      <img
        class="hero__logo"
        data-node-id="2:9"
        src="/public/assets/superhands-logo.svg"
        alt=""
        width="46"
        height="48"
        decoding="async"
      />
    </section>
  </body>
</html>
